name: Bug report
description: Report a reproducible, non-sensitive defect
body:
  - type: markdown
    attributes: {value: "Do not submit secrets or evidence from unauthorized targets."}
  - type: textarea
    id: description
    attributes: {label: Description}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction with synthetic data}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: RedSentinel version}
    validations: {required: true}
